<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Clipdeck project thumbnail">
  <defs>
    <linearGradient id="bg-clipdeck" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181a24"/>
      <stop offset="100%" stop-color="#101117"/>
    </linearGradient>
    <radialGradient id="glow-clipdeck" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#f5a93e" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#f5a93e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots-clipdeck" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#bg-clipdeck)"/>
