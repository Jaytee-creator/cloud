  <rect width="800" height="500" fill="url(#glow-clipdeck)"/>
  <rect x="0.5" y="0.5" width="799" height="499" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  <g transform="translate(400,190)" stroke="#f5a93e" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round">
    
        <rect x="-70" y="-50" width="140" height="100" rx="14"/>
        <polygon points="-15,-22 25,0 -15,22" fill="#f5a93e" stroke="none"/>
    
  </g>
  <text x="400" y="380" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#f3f4f7">Clipdeck</text>
  <text x="400" y="412" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" letter-spacing="2" fill="#8a8fa3">VIDEO GALLERY LAYOUTS</text>
